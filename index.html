<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation | P.Anupriya & R.R. Yogeshwaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFFDF6;
      --gold-primary: #D4AF37;
      --gold-dark: #B8860B;
      --pink-soft: #E8A5C8;
      --maroon-deep: #7A0C2E;
      --text-dark: #3A2E2B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1a0f0f;
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      background: var(--bg-cream);
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .envelope-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #2D0A14;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 1s ease-in-out, opacity 1s ease-in-out;
      cursor: pointer;
    }

    .envelope-screen.opened {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 200px;
      background: #4A1022;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid var(--gold-primary);
    }

    .wax-seal {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #D4AF37 0%, #8B6508 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid #FFF8DC;
      color: #3A0007;
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .envelope-tap-text {
      margin-top: 25px;
      color: var(--gold-primary);
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .pages-wrapper {
      flex: 1;
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .page {
      width: 33.333%;
      height: 100%;
      position: relative;
      padding: 30px 20px 70px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-y: auto;
      background-color: var(--bg-cream);
    }

    .bg-vines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 110px;
      pointer-events: none;
      opacity: 0.85;
      background-image: radial-gradient(circle at 50% -20%, #8EA885 0%, transparent 70%);
    }

    .bg-vines::before, .bg-vines::after {
      content: '🌿';
      position: absolute;
      font-size: 28px;
      top: 10px;
      opacity: 0.6;
    }
    .bg-vines::before { left: 20px; transform: rotate(-30deg); }
    .bg-vines::after { right: 20px; transform: rotate(30deg) scaleX(-1); }
